<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연애 영상 댓글 PoC</title>
  <style>
    :root { color-scheme: light; font-family: "Malgun Gothic", system-ui, sans-serif; color:#1b2539; background:#f2f5fb; }
    * { box-sizing:border-box; } body { margin:0; } header { padding:24px 32px 12px; }
    h1 { margin:0 0 7px; font-size:24px; } h2 { margin:0; font-size:18px; }
    p { line-height:1.55; } .sub { color:#596780; margin:0; font-size:14px; }
    main { padding:16px 32px 32px; display:grid; grid-template-columns:1.05fr 1.1fr .9fr; gap:16px; align-items:start; }
    section { background:#fff; border:1px solid #dce3ef; border-radius:14px; padding:20px; min-width:0; }
    .section-head { display:flex; align-items:center; gap:9px; margin-bottom:16px; }
    .num { background:#e9efff; color:#2944a6; border-radius:50%; width:28px; height:28px; display:grid; place-items:center; font-weight:700; font-size:14px; }
    button { cursor:pointer; border:0; border-radius:8px; padding:10px 14px; font-weight:700; background:#3156c8; color:#fff; }
    button:hover { background:#2545aa; } button:disabled { cursor:not-allowed; opacity:.48; }
    button.secondary { background:#edf1fa; color:#283859; } button.secondary:hover { background:#dfe6f5; }
    input, textarea { width:100%; border:1px solid #cbd5e5; border-radius:8px; padding:10px; font:inherit; }
    textarea { min-height:125px; resize:vertical; line-height:1.5; } .row { display:flex; gap:8px; margin-bottom:12px; }
    .row input { flex:1; min-width:0; } .row button { white-space:nowrap; } .muted { color:#6f7c91; font-size:13px; }
    .videos { display:grid; gap:8px; max-height:520px; overflow:auto; }
    .video { text-align:left; display:flex; align-items:center; gap:10px; width:100%; padding:9px; background:#f6f8fc; color:#1b2539; border:1px solid transparent; }
    .video:hover, .video.active { background:#edf2ff; border-color:#8ea5e5; }
    .video img { width:92px; aspect-ratio:16/9; object-fit:cover; border-radius:5px; background:#e5eaf3; }
    .video strong { display:block; font-size:13px; line-height:1.4; } .video small { display:block; margin-top:5px; color:#6f7c91; }
    .box { background:#f6f8fc; border-radius:8px; padding:12px; margin:12px 0; font-size:14px; line-height:1.5; }
    .label { display:block; font-size:12px; font-weight:700; color:#64718a; margin-bottom:5px; }
    .error { color:#b42318; white-space:pre-wrap; } .ok { color:#087443; } .status { min-height:22px; margin:8px 0; }
    .full { width:100%; } .history { padding-top:14px; border-top:1px solid #e1e7f0; margin-top:16px; max-height:340px; overflow:auto; }
    .history-item { padding:9px 0; border-bottom:1px solid #edf0f5; font-size:12px; line-height:1.5; overflow-wrap:anywhere; }
    .badge { display:inline-block; background:#eaf6ee; color:#087443; padding:3px 8px; border-radius:100px; font-size:12px; }
    @media(max-width:900px) { main { grid-template-columns:1fr; padding:12px; } header { padding:20px 16px 8px; } }
  </style>
</head>
<body>
<header>
  <h1>연애 영상 댓글 PoC</h1>
  <p class="sub">영상을 고르고 초안을 확인한 뒤 게시합니다. 테스트 댓글은 게시 확인 후 자동으로 삭제합니다.</p>
</header>
<main>
  <section>
    <div class="section-head"><span class="num">1</span><h2>영상 불러오기</h2></div>
    <div class="row"><input id="query" value="연애" aria-label="검색어"><button id="search">불러오기</button></div>
    <div class="row"><input id="url" placeholder="유튜브 영상 링크" aria-label="영상 링크"><button id="add" class="secondary">링크 선택</button></div>
    <p id="search-status" class="status muted"></p>
    <div id="videos" class="videos"></div>
  </section>
  <section>
    <div class="section-head"><span class="num">2</span><h2>분석과 댓글 초안</h2></div>
    <p id="selected" class="muted">왼쪽에서 영상을 선택해 주세요.</p>
    <p id="analysis-status" class="status muted"></p>
    <button id="regenerate" class="secondary" disabled>초안 다시 만들기</button>
    <div class="box"><span class="label">영상 속 고민</span><span id="concern">분석 후 표시됩니다.</span></div>
    <div class="box"><span class="label">영상에서 확인한 말</span><span id="evidence">분석 후 표시됩니다.</span></div>
    <div class="row"><input id="manual-evidence" placeholder="영상에서 직접 확인한 말" aria-label="직접 확인한 말"><button id="apply-evidence" class="secondary">근거 반영</button></div>
    <label class="label" for="comment">댓글 초안</label>
    <textarea id="comment" placeholder="분석 후 댓글이 나타납니다." disabled></textarea>
    <p id="length" class="muted">0 / 120자</p>
    <div class="row"><input id="tail" placeholder="마지막에 덧붙일 문구 (선택)" aria-label="마지막 문구"><button id="append" class="secondary">맨 끝에 추가</button></div>
    <p id="source" class="muted"></p>
  </section>
  <section>
    <div class="section-head"><span class="num">3</span><h2>댓글 달기</h2></div>
    <p><span class="badge">프로필: 유튜브1</span></p>
    <p class="muted">댓글을 확인하고 버튼을 누르면 크롬에서 한 글자씩 입력합니다. 게시 확인 후 방금 쓴 댓글을 삭제합니다.</p>
    <button id="post" class="full" disabled>댓글 달기</button>
    <p id="post-status" class="status muted"></p>
    <div class="history">
      <strong>오늘의 게시 기록</strong>
      <p id="quota" class="muted">불러오는 중…</p>
      <div id="history"></div>
    </div>
  </section>
</main>
<script>
  const state = { selected: null, analyzed: null };
  const byId = id => document.getElementById(id);
  const labels = {reserved:"게시 준비",opening:"프로필 여는 중",typing:"한 글자씩 입력 중",submitting:"게시 확인 중",confirmed:"게시 확인",uncertain:"게시 확인 필요",failed:"게시 전 실패"};
  async function api(path, options) {
    const response = await fetch(path, options);
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.detail || "요청에 실패했습니다.");
    return body;
  }
  function setStatus(id, text, failed) {
    const el = byId(id); el.textContent = text; el.className = "status " + (failed ? "error" : "muted");
  }
  function showVideo(video) {
    const button = document.createElement("button"); button.className = "video";
    const img = document.createElement("img"); img.src = video.thumbnail; img.alt = "";
    const body = document.createElement("span"); const title = document.createElement("strong");
    const meta = document.createElement("small"); title.textContent = video.title;
    meta.textContent = (video.channel || "채널") + " · " + (video.published || "날짜 미확인");
    body.append(title, meta); button.append(img, body); button.addEventListener("click", () => selectVideo(video, button));
    byId("videos").append(button);
  }
  async function selectVideo(video, button, force) {
    state.selected = video; state.analyzed = null; byId("post").disabled = true;
    byId("regenerate").disabled = true;
    document.querySelectorAll(".video").forEach(el => el.classList.remove("active"));
    if (button) button.classList.add("active");
    byId("selected").textContent = video.title; byId("concern").textContent = "분석 중…";
    byId("evidence").textContent = "분석 중…"; byId("comment").value = ""; byId("comment").disabled = true; updateLength();
    setStatus("analysis-status", "자막과 인기 댓글을 읽고 초안을 만들고 있습니다.", false);
    try {
      let result;
      const cached = force ? null : await fetch("/api/analysis?video_id=" + encodeURIComponent(video.id));
      if (cached && cached.ok) result = await cached.json();
      else result = await api("/api/analyze", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({video_id:video.id})});
      if (!state.selected || state.selected.id !== video.id) return;
      state.analyzed = result; byId("concern").textContent = result.draft.concern;
      byId("regenerate").disabled = false;
      byId("evidence").textContent = result.draft.evidence_quote || "영상 속 발언 확인 필요";
      byId("comment").value = result.draft.comment; byId("comment").disabled = false;
      byId("source").textContent = "자막: " + ({available:"확보",absent:"없음",error:"가져오기 실패"}[result.caption_state] || result.caption_state) + " · 인기 댓글 " + result.comment_count + "개";
      setStatus("analysis-status", result.draft.grounded ? (result.draft.evidence_source === "사용자 확인" ? "직접 확인한 근거입니다." : "영상 근거를 확인했습니다.") : "영상 근거를 확인해야 합니다.", !result.draft.grounded);
      updateLength();
    } catch(error) { setStatus("analysis-status", error.message, true); byId("concern").textContent = "분석하지 못했습니다."; byId("evidence").textContent = "확인할 수 없습니다."; }
  }
  function updateLength() {
    const text = byId("comment").value.trim();
    const count = typeof Intl.Segmenter === "function" ? Array.from(new Intl.Segmenter("ko", {granularity:"grapheme"}).segment(text)).length : Array.from(text).length;
    byId("length").textContent = count + " / 120자";
    byId("post").disabled = !state.analyzed || !state.analyzed.draft.grounded || count < 40 || count > 120;
  }
  byId("comment").addEventListener("input", updateLength);
  byId("apply-evidence").addEventListener("click", async () => {
    if (!state.selected) return;
    try {
      const result = await api("/api/evidence", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({video_id:state.selected.id,quote:byId("manual-evidence").value})});
      state.analyzed = result; byId("evidence").textContent = result.draft.evidence_quote;
      setStatus("analysis-status", "직접 확인한 근거를 반영했습니다. 댓글에도 이 내용을 넣어 주세요.", false);
      updateLength();
    } catch(error) { setStatus("analysis-status", error.message, true); }
  });
  byId("regenerate").addEventListener("click", () => { if (state.selected) selectVideo(state.selected, null, true); });
  byId("append").addEventListener("click", () => {
    const tail = byId("tail").value.trim();
    if (!tail || byId("comment").disabled) return;
    byId("comment").value = byId("comment").value.trim() + " " + tail;
    byId("tail").value = ""; updateLength();
  });
  byId("search").addEventListener("click", async () => {
    byId("search").disabled = true; byId("videos").replaceChildren(); setStatus("search-status", "최신 영상을 불러오는 중…", false);
    try { const result = await api("/api/search?query=" + encodeURIComponent(byId("query").value)); result.videos.forEach(showVideo); setStatus("search-status", result.videos.length + "개 영상을 찾았습니다.", false); }
    catch(error) { setStatus("search-status", error.message, true); }
    finally { byId("search").disabled = false; }
  });
  byId("add").addEventListener("click", async () => {
    setStatus("search-status", "영상 링크를 확인하는 중…", false);
    try { const video = await api("/api/video?url=" + encodeURIComponent(byId("url").value)); showVideo(video); setStatus("search-status", "영상을 찾았습니다.", false); selectVideo(video); }
    catch(error) { setStatus("search-status", error.message, true); }
  });
  byId("post").addEventListener("click", async () => {
    if (!state.selected) return;
    byId("post").disabled = true; setStatus("post-status", "게시를 준비하고 있습니다.", false);
    try { await api("/api/post", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({video_id:state.selected.id,comment:byId("comment").value})}); await refresh(); }
    catch(error) { setStatus("post-status", error.message, true); updateLength(); }
  });
  async function refresh() {
    try {
      const result = await api("/api/status");
      byId("quota").textContent = result.today + " · " + result.count + " / " + result.limit + "건";
      const list = byId("history"); list.replaceChildren();
      result.attempts.forEach(attempt => {
        const row = document.createElement("div"); row.className = "history-item";
        const title = document.createElement("strong");
        const deleted = attempt.deletion_status === "deleted" ? " · 삭제 확인" : attempt.deletion_status === "failed" ? " · 삭제 실패" : "";
        title.textContent = (labels[attempt.status] || attempt.status) + deleted;
        const detail = document.createElement("div"); detail.textContent = attempt.video_id + " · " + attempt.profile + " · " + attempt.updated_at;
        const text = document.createElement("div"); text.textContent = attempt.comment;
        row.append(title, detail, text);
        if (attempt.error || attempt.deletion_error) { const err = document.createElement("div"); err.className = "error"; err.textContent = attempt.error || attempt.deletion_error; row.append(err); }
        if (attempt.deletion_status === "failed") {
          const retry = document.createElement("button"); retry.className = "secondary";
          retry.textContent = result.retrying_deletions.includes(attempt.id) ? "삭제 확인 중" : "삭제 다시 시도";
          retry.disabled = result.retrying_deletions.includes(attempt.id);
          retry.addEventListener("click", async () => {
            retry.disabled = true;
            try { await api("/api/retry-deletion/" + attempt.id, {method:"POST"}); await refresh(); }
            catch(error) { setStatus("post-status", error.message, true); }
          });
          row.append(retry);
        }
        list.append(row);
      });
      const latest = result.attempts[0];
      if (latest) {
        const suffix = latest.deletion_status === "deleted" ? " · 삭제 확인" : latest.deletion_status === "failed" ? " · 삭제 실패" : "";
        setStatus("post-status", (labels[latest.status] || latest.status) + suffix, latest.status === "failed" || latest.status === "uncertain" || latest.deletion_status === "failed");
      }
    } catch(error) { setStatus("post-status", error.message, true); }
  }
  refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
